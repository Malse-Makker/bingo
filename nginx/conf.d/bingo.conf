# Bingo backend. TLS and the public hostname (bingo.makkers.net) are handled
# upstream by Nginx Proxy Manager; this server only listens on the internal
# port 80, published to the host as BINGO_PORT.

upstream bingo_app {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;

    # --- Real client IP ------------------------------------------------------
    # The only upstream is Nginx Proxy Manager on a private network, so trust
    # those ranges and take the real client IP from X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- Security headers ----------------------------------------------------
    # Set at server level so every location inherits them. Caching uses
    # `expires` instead of add_header, which would drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Everything from 'self': Font Awesome and all scripts are hosted locally,
    # and there are no inline scripts or inline style attributes in the HTML.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Static assets served directly by nginx ------------------------------
    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # The service worker must live at the root so its scope covers the app.
    location = /sw.js {
        alias /srv/static/js/sw.js;
        default_type application/javascript;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        access_log off;
    }

    location = /favicon.ico {
        alias /srv/static/img/icon-192.png;
        default_type image/png;
        expires 30d;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://bingo_app;
        access_log off;
    }

    # Login, registration, entering numbers and marking squares: tighter limit.
    location ~ ^/(inloggen|registreren|nummer|markeer/) {
        limit_req zone=schrijven burst=10 nodelay;
        proxy_pass http://bingo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://bingo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
