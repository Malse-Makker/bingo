user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # Rate limiting keyed on the real client IP (see set_real_ip_from below).
    # The status poll runs every 3s per player, so `general` has room for it;
    # login and number entry get a tighter zone.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=schrijven:10m rate=2r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
