name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          chmod 600 "$KEY_FILE"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$KEY_FILE"
          ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no ubuntu@makkers.net \
            "cd /home/ubuntu/bingo && git pull origin main && GIT_COMMIT=\$(git rev-parse --short HEAD) docker compose up -d --build --force-recreate"
